name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release package
        run: |
          chmod +x install.sh uninstall.sh bin/hiascend-agent lib/doctor.sh packaging/build-release.sh
          PYTHON=python3.11 packaging/build-release.sh

      - name: Show checksums
        run: cat dist/*.sha256

      - name: Test offline install in openEuler
        run: |
          chmod +x packaging/test-in-container.sh
          IMAGE=openeuler/openeuler:24.03-lts packaging/test-in-container.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hiascend-agent-release
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
